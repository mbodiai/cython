[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools", "wheel"]
[project]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Cython",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]
dependencies = [
    "natural @ file:///Users/sebastianperalta/simply/corp/projects/mbnew/.dev/mbodiai/natural",
    "pytest>=8.3.5",
    "mbcore @ file:///users/sebastianperalta/simply/corp/projects/mbnew/tmp/mbodiai/mbcore",
    "requests>=2.32.3",
    "aiohttp>=3.11.14",
    "pytest-asyncio>=0.26.0",
    "click>=8.1.8",
    "mrender>=1.0.1",
    "rich>=0.9.4",
    "rich-click>=0.8.6",
    "aiofiles>=0.1.0",
    "lxml>=0.3.1",
    "networkx>=0.4.2",
    "playwright>=0.50.0",
    "tomlkit>=0.13.2",
    "bs4>=0.0.2",
]
description = ""
name = "mbpy"
readme = "README.md"
requires-python = ">=3.10"
version = "2.0.20"
[project.scripts]
mb = "mbpy.main:main"
mbpip = "mbpy.main:main"
mbpy = "mbpy.main:main"
mpip = "mbpy.main:main"
[project.optional-dependencies]
cython = []
dev = [
  "xlib",
  "editables>=0.5.0",
  "hatch>=1.14.0",
  "datamodel-code-generator>=0.28.2",
  "numpy>=2.2.3",
  "hypothesis>=6.127.1",
