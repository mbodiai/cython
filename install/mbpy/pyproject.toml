  "pytest-asyncio>=0.25.3",
  "pytest>=8.3.4",
  "ultralytics",
  "blessed>=1.20.0",
  "textual>=1.0.0",
]
extras = [
  "uvloop>=0.21.0",
  "aiofiles==24.1.0",
  "diskcache>=5.6.3",
  "lxml",
  "requests>=2.26.0",
  "rich-click>=1.8.3",
  "tomlkit>=0.12.0",
]
mkdocs = [
  "mkdocs>=1.6.1",
  "mkdocs-material>=9.5.42",
  "mkdocs>=1.6.1",
  "mkdocstrings>=0.24.3",
]
perf = ["aiohttp>=3.11.11", "orjson>=3.10.12", "uvloop>=0.21.0"]
profile = ["psutil>=6.1.1", "pynvml>=12.0.0"]
sphinx = [
  "sphinxcontrib-napoleon>=0.7",
  "sphinx>=8.1.3",
  "furo",
  "sphinx-tippy>=0.4.3",
  "sphinx>=6.2.1",
  "sphinx-autodoc2>=0.5.0",
  "sphinx-design>=0.5.0",
]
pdf = ["pymupdf>=1.24.11"]

all = [
    "natural @ file:///Users/sebastianperalta/simply/corp/projects/mbnew/.dev/mbodiai/natural",
    "pytest>=8.3.5",
    "requests>=2.32.3",
    "aiohttp>=3.11.14",
    "pytest-asyncio>=0.26.0",
    "click>=8.1.8",
    "mrender>=1.0.1",
    "rich>=0.9.4",
    "rich-click>=0.8.6",
    "aiofiles>=0.1.0",
    "lxml>=0.3.1",
    "networkx>=0.4.2",
    "playwright>=0.50.0",
    "tomlkit>=0.13.2",
    "bs4>=0.0.2",
    "pymupdf>=1.24.11",
    "lightning>=2.5.1",
    "opencv-contrib-python>=4.11.0.86",
    "xlib",
    "editables>=0.5.0",
    "hatch>=1.14.0",
    "numpy>=2.2.3",
]
custom = ["mrender>=1.0.218", "rich-click>=1.8.5", "aiofiles>=24.1.0"]
graph = ["networkx>=2.6.3", "numpy>=1.21.2", "scikit-learn>=1.0.2"]

[tool.setuptools]
[tool.setuptools.packages.find]
exclude = ["tests", "docs", "tmp", "venv", ".vemv", "mbdev"]
include = ["*"]
where = ["."]
[tool.setuptools.package-data]
"*" = ["*.json", "*.yaml", "*.yml", "*.txt", "*.csv", "*.sh"]
mbpy = [
  "scripts/*.sh",
  "scripts/*.zsh",
  "scripts/*.bash",
  "scripts/*.json",
  "store/schemas/*.json",
  "**/*.pyi",
  "**/*.py",
  "**/*.pyx",
  "**/*.pxd",
]

[tool.mb]
entry-points = ["mbpy.main:main"]
include = ["mbpy", "tmp/mbodiai/mbcore"]
src = "."
[tool.mb.envs]
[tool.mb.envs.mb]
dependencies = ["datamodel-codegenerator"]
[tool.mypy]
[tool.pytest.ini_options]
addopts = "--import-mode=importlib -m 'not slow'"
asyncio_mode = "auto"
markers = "slow: marks tests that may take a long time to execute"
asyncio_default_fixture_loop_scope = "function"

[tool.pyright]
extraPaths = [".dev/some_org/some_repo", "/Users/sebastianperalta/simply/corp/projects/mbnew/.dev/some_org/some_repo"]
reportSelfClsParameterName = false

[dependency-groups]
c = ["cython>=3.0.11"]
dev = ["jaraco-text>=4.0.0", "mypy>=1.13.0", "playwright>=1.49.0"]
types = ["mypy>=1.13.0"]

[tool.mb.logs]
exclude_modules = ["markdown_it"]
full_trace = "False"
ignore_third_party = "False"
level = "debug"
pathdir = "/Users/sebastianperalta/.mb/logs"
show_locals = "False"
show_stack = "False"

[tool.mb.logs.handlers]
default = ["rich"]
file = ["file"]
