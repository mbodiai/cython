
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JSON Explorer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        
        .json-key { color: #2563eb; font-weight: 500; }
        .json-string { color: #16a34a; }
        .json-number { color: #0284c7; }
        .json-boolean { color: #7c3aed; }
        .json-null { color: #94a3b8; font-style: italic; }
        
        .json-explorer-container {
            font-family: 'Menlo', 'Monaco', 'Courier New', monospace;
            font-size: 14px;
            line-height: 1.5;
        }
        
        .hovered { background-color: rgba(219, 234, 254, 0.4); }
    </style>
</head>
<body class="bg-gray-50">
    <main class="max-w-4xl mx-auto px-4 py-8">
        <h2 class="text-2xl font-medium text-gray-900 mb-6">JSON Explorer</h2>
        
        <div class="bg-blue-50 rounded-lg p-4 mb-6 border border-blue-100">
            <h3 class="text-lg font-medium text-blue-800 mb-2">Interaction Guide</h3>
            <ul class="space-y-1 text-blue-700">
                <li>• <strong>Scroll up</strong>: Expand deeper one level at a time</li>
                <li>• <strong>Scroll down</strong>: Collapse back up one level at a time</li>
                <li>• <strong>Shift+Scroll</strong>: Apply to all siblings</li>
                <li>• <strong>Cmd+Scroll</strong>: Normal page scrolling</li>
            </ul>
        </div>

        <div class="bg-white rounded-lg border border-gray-200 mb-12">
            <div class="px-5 py-4 border-b border-gray-100 flex justify-between items-center">
                <h3 class="text-lg font-medium text-gray-800">Research Data</h3>
                <div class="text-sm text-gray-600">
                    Hovered: <span id="hovered-path">root</span>
                </div>
            </div>
            
            <div id="explorer-container" class="p-5 json-explorer-container overflow-auto" style="max-height: 600px">
                <div id="json-explorer"></div>
            </div>
        </div>
    </main>

    <script>
        // Sample research dataset
        const researchData = {
            "project": {
                "title": "Transformer-based Vision Models",
                "authors": ["Emma Johnson", "David Chen", "Sarah Williams"],
                "institution": "AI Research Institute",
                "date": "2025-03-01"
            },
            "methodology": {
                "approach": "Self-supervised pre-training followed by supervised fine-tuning",
                "architecture": {
                    "backbone": "Vision Transformer",
                    "encoderLayers": 12,
                    "attention": {
                        "heads": 8,
                        "dimensions": 768,
                        "dropout": 0.1
                    },
                    "parameters": 85.8e6
                },
                "training": {
                    "epochs": 300,
                    "batchSize": 256,
                    "optimizer": {
                        "name": "AdamW",
                        "learningRate": 1e-4,
                        "weightDecay": 0.05
                    },
                    "augmentations": [
                        "random cropping",
                        "horizontal flipping",
                        "color jittering",
                        "random erasing"
                    ]
                }
            },
            "datasets": {
                "pretraining": {
                    "name": "ImageNet-21k",
                    "size": 14.2e6,
                    "resolution": "224x224"
                },
                "finetuning": {
                    "name": "ImageNet-1k",
                    "trainSize": 1.28e6,
                    "valSize": 50000,
                    "classes": 1000
                },
                "evaluation": [
                    {
                        "name": "COCO",
                        "task": "object detection",
                        "metrics": {
                            "mAP": 43.8,
                            "AP50": 62.5,
                            "AP75": 47.3
                        }
                    },
                    {
                        "name": "ADE20K",
                        "task": "semantic segmentation",
                        "metrics": {
                            "mIoU": 48.7,
                            "pixelAccuracy": 81.2
                        }
                    }
                ]
            },
            "results": {
                "accuracy": {
                    "top1": 0.845,
                    "top5": 0.972
                },
                "comparisons": [
                    {
                        "model": "ResNet-50",
                        "top1": 0.761,
                        "difference": "+8.4%"
                    },
                    {
                        "model": "EfficientNet-B7",
                        "top1": 0.829,
                        "difference": "+1.6%"
                    }
                ],
                "ablationStudies": {
                    "noPretraining": {
                        "top1": 0.693,
                        "difference": "-15.2%"
                    },
                    "reducedLayers": {
                        "top1": 0.814,
                        "difference": "-3.1%"
                    },
                    "smallerHeadCount": {
                        "top1": 0.831,
                        "difference": "-1.4%"
                    }
                }
            }
        };

        class JSONExplorer {
            constructor(data, containerId) {
                this.data = data;
                this.container = document.getElementById(containerId);
                this.explorerContainer = document.getElementById('explorer-container');
                this.expandedPaths = new Set(['root']);
                this.hoveredPath = 'root';
                this.hoveredPathDisplay = document.getElementById('hovered-path');
                
                this.render();
                
                this.explorerContainer.addEventListener('wheel', this.handleWheel.bind(this), { passive: false });
                this.explorerContainer.addEventListener('mouseover', this.handleMouseOver.bind(this));
            }
            
            // Track which node is being hovered over
            handleMouseOver(event) {
                let target = event.target;
                while (target && !target.hasAttribute('data-path')) {
                    target = target.parentElement;
                }
                
                if (target) {
                    const newPath = target.getAttribute('data-path');
                    if (newPath !== this.hoveredPath) {
                        this.hoveredPath = newPath;
                        this.hoveredPathDisplay.textContent = this.hoveredPath;
                        
                        // Update hover styling
                        document.querySelectorAll('.hovered').forEach(el => {
                            el.classList.remove('hovered');
                        });
                        target.classList.add('hovered');
                    }
                }
            }
            
            // Very simple utility functions
            getParentPath(path) {
                if (path === 'root') return null;
                const parts = path.split('.');
                return parts.length > 1 ? parts.slice(0, -1).join('.') : 'root';
            }
            
            getPathLevel(path) {
                return path === 'root' ? 0 : path.split('.').length;
            }
            
            isChildOf(childPath, parentPath) {
                if (parentPath === 'root') return childPath !== 'root';
                return childPath.startsWith(parentPath + '.') && 
                       childPath.split('.').length === parentPath.split('.').length + 1;
            }
            
            isDescendantOf(path, ancestorPath) {
                if (path === ancestorPath) return false;
                if (ancestorPath === 'root') return true;
                return path.startsWith(ancestorPath + '.');
            }
            
            getValue(path) {
                if (path === 'root') return this.data;
                
                const parts = path.split('.');
                let value = this.data;
                
                for (const part of parts) {
                    if (value === null || typeof value !== 'object') return undefined;
                    value = value[part];
                }
                
                return value;
            }
            
            isObject(path) {
                const value = this.getValue(path);
                return value !== null && typeof value === 'object';
            }
            
            getChildren(path) {
                const value = this.getValue(path);
                
                if (!value || typeof value !== 'object') return [];
                
                const prefix = path === 'root' ? '' : path + '.';
                return Object.keys(value).map(key => prefix + key);
            }
            
            getSiblings(path) {
                if (path === 'root') return ['root'];
                const parent = this.getParentPath(path);
                return this.getChildren(parent);
            }
            
            // Core interaction handlers
            handleWheel(event) {
                if (event.metaKey || event.ctrlKey) return;
                
                event.preventDefault();
                
                const path = this.hoveredPath;
                if (!path) return;
                
                const direction = event.deltaY < 0 ? 1 : -1; // 1 for expand, -1 for collapse
                
                if (event.shiftKey) {
                    this.handleShiftScroll(path, direction);
                } else {
                    this.handleRegularScroll(path, direction);
                }
                
                this.render();
            }
            
            // Super simple expanding algorithm for regular scroll
            handleRegularScroll(path, direction) {
                // EXPANDING (scroll up)
                if (direction > 0) {
                    // If this path isn't expanded yet, expand it
                    if (!this.expandedPaths.has(path) && this.isObject(path)) {
                        this.expandedPaths.add(path);
                        return;
                    }
                    
                    // Path is already expanded, find an unexpanded child
                    const children = this.getChildren(path);
                    
                    for (const child of children) {
                        if (this.isObject(child) && !this.expandedPaths.has(child)) {
                            this.expandedPaths.add(child);
                            return;
                        }
                    }
                    
                    // If all direct children are expanded, try to find an unexpanded grandchild
                    for (const child of children) {
                        if (this.expandedPaths.has(child)) {
                            const grandchildren = this.getChildren(child);
                            
                            for (const grandchild of grandchildren) {
                                if (this.isObject(grandchild) && !this.expandedPaths.has(grandchild)) {
                                    this.expandedPaths.add(grandchild);
                                    return;
                                }
                            }
                        }
                    }
                } 
                // COLLAPSING (scroll down)
                else {
                    // Can't collapse root
                    if (path === 'root') return;
                    
                    // If this path is expanded, collapse it
                    if (this.expandedPaths.has(path)) {
                        this.expandedPaths.delete(path);
                        
                        // Also remove all descendants
                        Array.from(this.expandedPaths)
                            .filter(p => this.isDescendantOf(p, path))
                            .forEach(p => this.expandedPaths.delete(p));
                    } 
                    // Path is already collapsed, try to collapse its parent
                    else {
                        const parent = this.getParentPath(path);
                        if (parent !== 'root' && this.expandedPaths.has(parent)) {
                            this.expandedPaths.delete(parent);
                            
                            // Also remove all descendants
                            Array.from(this.expandedPaths)
                                .filter(p => this.isDescendantOf(p, parent))
                                .forEach(p => this.expandedPaths.delete(p));
                        }
                    }
                }
            }
            
            // Handle shift+scroll - apply to siblings
            handleShiftScroll(path, direction) {
                // EXPANDING (shift+scroll up)
                if (direction > 0) {
                    // Get all siblings
                    const siblings = this.getSiblings(path);
                    
                    // Check if all siblings are already expanded
                    const allExpanded = siblings.every(p => 
                        this.expandedPaths.has(p) || !this.isObject(p)
                    );
                    
                    if (!allExpanded) {
                        // Expand all siblings that are objects
                        siblings.forEach(sibling => {
                            if (this.isObject(sibling)) {
                                this.expandedPaths.add(sibling);
                            }
                        });
                    } else {
                        // All siblings are already expanded, try to expand their children
                        let expandedAny = false;
                        
                        for (const sibling of siblings) {
                            if (this.expandedPaths.has(sibling)) {
                                const children = this.getChildren(sibling);
                                
                                for (const child of children) {
                                    if (this.isObject(child) && !this.expandedPaths.has(child)) {
                                        this.expandedPaths.add(child);
                                        expandedAny = true;
                                    }
                                }
                            }
                        }
                        
                        // If we didn't expand any children, try grandchildren
                        if (!expandedAny) {
                            for (const sibling of siblings) {
                                if (this.expandedPaths.has(sibling)) {
                                    const children = this.getChildren(sibling);
                                    
                                    for (const child of children) {
                                        if (this.expandedPaths.has(child)) {
                                            const grandchildren = this.getChildren(child);
                                            
                                            for (const grandchild of grandchildren) {
                                                if (this.isObject(grandchild) && !this.expandedPaths.has(grandchild)) {
                                                    this.expandedPaths.add(grandchild);
                                                    return;
                                                }
                                            }
                                        }
                                    }
                                }
                            }
                        }
                    }
                } 
                // COLLAPSING (shift+scroll down)
                else {
                    if (path === 'root') return;
                    
                    // Get parent and siblings
                    const parent = this.getParentPath(path);
                    const siblings = this.getSiblings(path);
                    
                    // Check if any sibling is expanded
                    const anySiblingExpanded = siblings.some(p => this.expandedPaths.has(p));
                    
                    if (anySiblingExpanded) {
                        // Collapse all siblings and their descendants
                        siblings.forEach(sibling => {
                            this.expandedPaths.delete(sibling);
                            
                            Array.from(this.expandedPaths)
                                .filter(p => this.isDescendantOf(p, sibling))
                                .forEach(p => this.expandedPaths.delete(p));
                        });
                    } else if (parent !== 'root') {
                        // All siblings already collapsed, collapse parent
                        this.expandedPaths.delete(parent);
                        
                        // Also collapse parent's descendants
                        Array.from(this.expandedPaths)
                            .filter(p => this.isDescendantOf(p, parent))
                            .forEach(p => this.expandedPaths.delete(p));
                    }
                }
            }
            
            // Format value for display
            formatValue(value) {
                if (value === null) return '<span class="json-null">null</span>';
                if (value === undefined) return '<span class="json-null">undefined</span>';
                
                switch (typeof value) {
                    case 'string':
                        return `<span class="json-string">"${value}"</span>`;
                    case 'number':
                        return `<span class="json-number">${value}</span>`;
                    case 'boolean':
                        return `<span class="json-boolean">${value}</span>`;
                    default:
                        return String(value);
                }
            }
            
            // Render the entire explorer
            render() {
                this.container.innerHTML = this.renderNode('root', this.data, 0);
            }
            
            // Render a single node
            renderNode(path, value, level) {
                const isObject = typeof value === 'object' && value !== null;
                const isArray = Array.isArray(value);
                const nodeKey = path === 'root' ? '' : path.split('.').pop();
                const isExpanded = this.expandedPaths.has(path);
                const isHovered = path === this.hoveredPath;
                
                let html = `<div class="py-0.5 pl-${level > 0 ? level * 4 : 0} ${isHovered ? 'hovered' : ''}" data-path="${path}" data-level="${level}">`;
                
                // Don't show the root key
                if (path !== 'root') {
                    html += '<div class="flex items-start hover:bg-gray-50 rounded px-1">';
                    
                    // Expansion indicator for objects
                    if (isObject) {
                        const icon = isExpanded ? '▼' : '▶';
                        html += `<span class="text-gray-400 mr-1 w-4">${icon}</span>`;
                    } else {
                        html += '<span class="w-4"></span>';
                    }
                    
                    // Key name
                    html += `<span class="json-key">${nodeKey}${isArray ? '[]' : ''}</span>`;
                    
                    // Value for non-objects or collapsed summary
                    if (!isObject) {
                        html += `: <span class="ml-1">${this.formatValue(value)}</span>`;
                    } else if (!isExpanded) {
                        const count = Object.keys(value).length;
                        html += `<span class="ml-2 text-gray-500 text-sm">${count} ${count === 1 ? 'item' : 'items'}</span>`;
                    }
                    
                    html += '</div>';
                }
                
                // Render children for expanded objects
                if (isObject && (isExpanded || path === 'root')) {
                    if (path !== 'root') {
                        html += '<div class="ml-4">';
                    }
                    
                    for (const key in value) {
                        const childPath = path === 'root' ? key : `${path}.${key}`;
                        html += this.renderNode(childPath, value[key], level + 1);
                    }
                    
                    if (path !== 'root') {
                        html += '</div>';
                    }
                }
                
                html += '</div>';
                return html;
            }
        }

        // Initialize when the document is loaded
        document.addEventListener('DOMContentLoaded', () => {
            new JSONExplorer(researchData, 'json-explorer');
        });
    </script>
</body>
</html>
